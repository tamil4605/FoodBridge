# ==============================================================
# FoodBridge Application Configuration
# ==============================================================

server.port=8082
spring.application.name=foodbridge

# --------------------------------------------------------------
# MySQL Database Connection
# --------------------------------------------------------------

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:foodbridge_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------------
# Hibernate and JPA
# --------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --------------------------------------------------------------
# Thymeleaf Template Engine
# --------------------------------------------------------------

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --------------------------------------------------------------
# Session and Security Settings
# --------------------------------------------------------------

server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --------------------------------------------------------------
# File Upload Configuration
# --------------------------------------------------------------

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --------------------------------------------------------------
# FoodBridge Demo Data
# --------------------------------------------------------------

foodbridge.demo-data.enabled=true