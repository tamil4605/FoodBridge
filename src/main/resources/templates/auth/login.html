<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Sign In')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                            <i class="bi bi-heart-fill"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Welcome Back</h2>
                        <p class="text-muted small">Sign in to manage donations, requests, and community impacts</p>
                    </div>

                    <form id="loginForm" th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="loginEmail" name="username"
                                       placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="loginPassword" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="loginPassword" name="password"
                                       placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-fb-primary w-100 py-2 fs-6 fw-bold mb-3">
                            Sign In to Account
                        </button>
                    </form>

                    <div class="text-center small text-muted mb-4">
                        Don't have an account yet? <a th:href="@{/auth/register}" class="fw-bold text-success text-decoration-none">Create Account</a>
                    </div>

                    <!-- Quick Demo Credentials Box for Evaluation -->
                    <div class="p-3 rounded-3 border bg-light">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="small fw-bold text-uppercase text-secondary">
                                <i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Logins
                            </span>
                            <span class="badge bg-secondary-subtle text-secondary small">1-Click Auto Fill</span>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-sm btn-outline-success text-start"
                                    onclick="fillDemoCredentials('saravana@demorestaurant.com', 'Donor@123')">
                                <i class="bi bi-shop me-1"></i> <strong>Restaurant Donor:</strong> Saravana Grand
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-primary text-start"
                                    onclick="fillDemoCredentials('hope@demoorphanage.org', 'Org@123')">
                                <i class="bi bi-people-fill me-1"></i> <strong>Recipient Org:</strong> Hope Orphanage
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary text-start"
                                    onclick="fillDemoCredentials('rajesh@demodonor.com', 'Donor@123')">
                                <i class="bi bi-person me-1"></i> <strong>Individual Donor:</strong> Rajesh Kumar
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger text-start"
                                    onclick="fillDemoCredentials('admin@foodbridge.org', 'Admin@123')">
                                <i class="bi bi-shield-lock me-1"></i> <strong>Administrator:</strong> Platform Admin
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
