<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Post Surplus Food')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-lg p-4 p-md-5 bg-white rounded-4">
                    <div class="mb-4">
                        <span class="badge bg-success-subtle text-success border mb-2">Food Donation Module</span>
                        <h2 class="fw-bold mb-1">List Surplus Food Donation</h2>
                        <p class="text-muted small">Share wholesome surplus meals, fresh baked goods, or perishables with community organizations in need</p>
                    </div>

                    <form th:action="@{/food/create}" th:object="${foodDto}" method="post">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="foodName" class="form-label fw-semibold">Food Listing Title *</label>
                                <input type="text" class="form-control" id="foodName" th:field="*{foodName}"
                                       placeholder="e.g. Fresh Vegetable Biryani with Raita" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('foodName')}" th:errors="*{foodName}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="dietaryType" class="form-label fw-semibold">Dietary Classification *</label>
                                <select class="form-select" id="dietaryType" th:field="*{dietaryType}" required>
                                    <option th:each="d : ${dietaryTypes}" th:value="${d}" th:text="${d.label}">Veg</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold">Food Category *</label>
                                <select class="form-select" id="category" th:field="*{category}" required>
                                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}">Category</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label for="quantity" class="form-label fw-semibold">Quantity *</label>
                                <input type="number" step="0.5" min="0.5" class="form-control" id="quantity" th:field="*{quantity}" placeholder="50" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                            </div>

                            <div class="col-md-3">
                                <label for="unit" class="form-label fw-semibold">Unit *</label>
                                <input type="text" class="form-control" id="unit" th:field="*{unit}" placeholder="meals, kg, packets" required>
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold">Description & Preparation Summary</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                          placeholder="Provide details about packaging, freshness, temperature, and ingredients..."></textarea>
                            </div>

                            <div class="col-md-6">
                                <label for="prepTime" class="form-label fw-semibold">Preparation Date & Time *</label>
                                <input type="datetime-local" class="form-control" id="prepTime" th:field="*{preparationDateTime}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('preparationDateTime')}" th:errors="*{preparationDateTime}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="deadline" class="form-label fw-semibold">Safe Collection Deadline *</label>
                                <input type="datetime-local" class="form-control" id="deadline" th:field="*{safeCollectionDeadline}" required>
                                <div class="form-text small text-danger"><i class="bi bi-shield-exclamation me-1"></i>Must be safe for consumption until this time.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('safeCollectionDeadline')}" th:errors="*{safeCollectionDeadline}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="storage" class="form-label fw-semibold">Storage Instructions</label>
                                <input type="text" class="form-control" id="storage" th:field="*{storageInstructions}"
                                       placeholder="e.g. Keep refrigerated below 5°C, or Reheat before serving">
                            </div>

                            <div class="col-md-6">
                                <label for="allergens" class="form-label fw-semibold">Allergen Advice</label>
                                <input type="text" class="form-control" id="allergens" th:field="*{allergenInfo}"
                                       placeholder="e.g. Contains dairy, nuts, gluten, or None">
                            </div>

                            <div class="col-12">
                                <h6 class="fw-bold mt-3 mb-2 text-success"><i class="bi bi-geo-alt-fill me-1"></i> Pickup Location Details</h6>
                            </div>

                            <div class="col-12">
                                <label for="pickupAddress" class="form-label fw-semibold">Pickup Address *</label>
                                <input type="text" class="form-control" id="pickupAddress" th:field="*{pickupAddress}" required>
                            </div>

                            <div class="col-md-6">
                                <label for="city" class="form-label fw-semibold">City *</label>
                                <input type="text" class="form-control" id="city" th:field="*{city}" required>
                            </div>

                            <div class="col-md-6">
                                <label for="pincode" class="form-label fw-semibold">Pincode *</label>
                                <input type="text" class="form-control" id="pincode" th:field="*{pincode}" required>
                            </div>

                            <div class="col-12">
                                <label for="instructions" class="form-label fw-semibold">Special Pickup Instructions</label>
                                <input type="text" class="form-control" id="instructions" th:field="*{pickupInstructions}"
                                       placeholder="e.g. Gate B, ask for Kitchen Manager Anand, bring insulated carriers">
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex justify-content-between">
                            <a th:href="@{/food}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-fb-primary px-4 fw-bold">Publish Food Donation</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
