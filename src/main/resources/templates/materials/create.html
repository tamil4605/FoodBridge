<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Donate Materials')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-lg p-4 p-md-5 bg-white rounded-4">
                    <div class="mb-4">
                        <span class="badge bg-primary-subtle text-primary border mb-2">Material Donation Module</span>
                        <h2 class="fw-bold mb-1">Donate Essential Materials</h2>
                        <p class="text-muted small">Share blankets, winter clothing, books, dry rations, or hygiene supplies with local charities</p>
                    </div>

                    <form th:action="@{/materials/create}" th:object="${materialDto}" method="post">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="itemName" class="form-label fw-semibold">Item Name / Title *</label>
                                <input type="text" class="form-control" id="itemName" th:field="*{itemName}"
                                       placeholder="e.g. Warm Fleece Winter Blankets" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('itemName')}" th:errors="*{itemName}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="condition" class="form-label fw-semibold">Item Condition *</label>
                                <select class="form-select" id="condition" th:field="*{conditionStatus}" required>
                                    <option th:each="cond : ${conditions}" th:value="${cond}" th:text="${cond.label}">New</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold">Material Category *</label>
                                <select class="form-select" id="category" th:field="*{category}" required>
                                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}">Category</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label for="quantity" class="form-label fw-semibold">Quantity *</label>
                                <input type="number" min="1" class="form-control" id="quantity" th:field="*{quantity}" placeholder="20" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                            </div>

                            <div class="col-md-3">
                                <label for="unit" class="form-label fw-semibold">Unit *</label>
                                <input type="text" class="form-control" id="unit" th:field="*{unit}" placeholder="sets, items, pairs" required>
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold">Description & Item Specifications</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                          placeholder="Describe size, condition details, cleanliness, and specifications..."></textarea>
                            </div>

                            <div class="col-md-6">
                                <label for="expiryDate" class="form-label fw-semibold">Expiry Date (For Food Rations / Hygiene)</label>
                                <input type="date" class="form-control" id="expiryDate" th:field="*{expiryDate}">
                                <div class="form-text small">Leave blank for clothes, books, and bedding.</div>
                            </div>

                            <div class="col-md-6">
                                <label for="prefDate" class="form-label fw-semibold">Preferred Pickup Date</label>
                                <input type="date" class="form-control" id="prefDate" th:field="*{preferredPickupDate}">
                            </div>

                            <div class="col-12">
                                <h6 class="fw-bold mt-3 mb-2 text-success"><i class="bi bi-geo-alt-fill me-1"></i> Pickup Location Details</h6>
                            </div>

                            <div class="col-12">
                                <label for="pickupAddress" class="form-label fw-semibold">Pickup Address *</label>
                                <input type="text" class="form-control" id="pickupAddress" th:field="*{pickupAddress}" required>
                            </div>

                            <div class="col-md-6">
                                <label for="city" class="form-label fw-semibold">City *</label>
                                <input type="text" class="form-control" id="city" th:field="*{city}" required>
                            </div>

                            <div class="col-md-6">
                                <label for="pincode" class="form-label fw-semibold">Pincode *</label>
                                <input type="text" class="form-control" id="pincode" th:field="*{pincode}" required>
                            </div>

                            <div class="col-12">
                                <label for="instructions" class="form-label fw-semibold">Special Pickup Instructions</label>
                                <input type="text" class="form-control" id="instructions" th:field="*{pickupInstructions}"
                                       placeholder="e.g. Items packed in cardboard boxes, ground floor loading">
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex justify-content-between">
                            <a th:href="@{/materials}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-fb-primary px-4 fw-bold">Publish Material Listing</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
