<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Resource Not Found (404)')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container py-5 text-center">
        <div class="stat-icon-wrapper stat-icon-blue mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
            <i class="bi bi-search"></i>
        </div>
        <h1 class="display-5 fw-bold mb-2">404 &mdash; Page or Item Not Found</h1>
        <p class="text-muted lead mx-auto mb-4" style="max-width: 500px;"
           th:text="${message != null ? message : 'The requested donation listing, campaign, or page could not be located.'}">
            The requested resource could not be found.
        </p>
        <a th:href="@{/}" class="btn btn-fb-primary">Return to Homepage</a>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
