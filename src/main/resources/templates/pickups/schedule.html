<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Schedule Pickup')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card border-0 shadow-lg p-4 p-md-5 bg-white rounded-4">
                    <div class="mb-4">
                        <span class="badge bg-primary-subtle text-primary border mb-2">Pickup Coordination</span>
                        <h2 class="fw-bold mb-1">Schedule Donation Pickup</h2>
                        <p class="text-muted small">Coordinate collection timing and address for accepted request</p>
                    </div>

                    <div class="p-3 bg-light rounded-3 mb-4 border">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Donation Item:</span>
                            <strong th:text="${request.itemTitle}">Item Title</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Requested Quantity:</span>
                            <strong th:text="${request.requestedQuantity} + ' ' + ${request.unit}">Quantity</strong>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted small">Donor:</span>
                            <span th:text="${request.donor.effectiveName}">Donor Name</span>
                        </div>
                    </div>

                    <form th:action="@{/pickups/schedule}" th:object="${pickupDto}" method="post">
                        <input type="hidden" th:field="*{requestId}">

                        <div class="mb-3">
                            <label for="schedTime" class="form-label fw-semibold">Pickup Date & Time *</label>
                            <input type="datetime-local" class="form-control" id="schedTime" th:field="*{scheduledDateTime}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('scheduledDateTime')}" th:errors="*{scheduledDateTime}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="pickupAddress" class="form-label fw-semibold">Pickup Address *</label>
                            <input type="text" class="form-control" id="pickupAddress" th:field="*{pickupAddress}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('pickupAddress')}" th:errors="*{pickupAddress}"></div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="city" class="form-label fw-semibold">City *</label>
                                <input type="text" class="form-control" id="city" th:field="*{city}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="pincode" class="form-label fw-semibold">Pincode *</label>
                                <input type="text" class="form-control" id="pincode" th:field="*{pincode}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="instructions" class="form-label fw-semibold">Special Vehicle / Transport Instructions</label>
                            <textarea class="form-control" id="instructions" th:field="*{specialInstructions}" rows="2"
                                      placeholder="e.g. Volunteer vehicle arriving in white Maruti Omni, carrying 2 insulated carrier boxes"></textarea>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-fb-primary px-4 fw-bold">Confirm Pickup Schedule</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
